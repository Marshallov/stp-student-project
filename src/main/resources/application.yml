server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-circular-references: true
  application:
    name: student
  jpa:
    hibernate.ddl-auto: update
    properties:
      hibernate.default_schema: ${SPRING_DATASOURCE_SCHEMA:students_schema}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:students_db;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS students_schema;
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:10000}
